[package]
name = "table"
version = "0.1.0"
authors = ["Crash <1903291+hex22a@users.noreply.github.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "table"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"
nb = "1.1.0"
embedded-hal = "1.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "0bbec46f7cfee8542f89f0257619d76cddbf835b"
features = ["arduino-uno"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
